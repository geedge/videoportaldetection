# kafka地址
bootstrap.servers=192.168.10.28:9092
kafka.avc.topic = AV-EVENT-COMPLETED-LOG
kafka.av.topic = AV-EVENT-LOG

# 时间窗口
# interval = 23
intervalLeft = 60
intervalRight = 15

# Spark地址
Spark.master=spark://192.168.10.9:7077
# prefix算法的置信度
prefixConfidence=0.3
# MaxPatternLength
prefixMaxPatternLength=2
# 用于数据挖掘的历史时间，当前时间-最长间隔=最早使用的历史日志，注意这里的单位为天
historyTrafficInterval=180
# 候选集最大容量
candidateSize=50
# Redis候选表中的过期时间，单位为天
ExpirationTime=1
# 最少进行序列挖掘的记录数目
leastHistoryNum=5

# 序列挖掘的行数限制和每一行的size限制，此2参数控制了内存是否会溢出
rawLimit = 100
colLimit = 200
# 当前行数和字段的长度比也会导致内存的溢出
ratioRawCol=10